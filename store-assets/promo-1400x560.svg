<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="跨海聊 CrossChat">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="560" fill="#ffffff"/>
  <circle cx="1250" cy="80" r="300" fill="url(#blob1)"/>
  <circle cx="120" cy="520" r="260" fill="url(#blob1)"/>

  <!-- 图标（320px，缩放 2.5x） -->
  <g transform="translate(90,120) scale(2.5)">
    <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#g)"/>
    <path d="M46 30 h36 a16 16 0 0 1 16 16 v20 a16 16 0 0 1-16 16 h-9 l-17 15 v-15 h-10 a16 16 0 0 1-16-16 V46 a16 16 0 0 1 16-16 z" fill="#ffffff"/>
    <circle cx="51" cy="66" r="6.5" fill="#1f6feb"/>
    <circle cx="64" cy="66" r="6.5" fill="#1f6feb"/>
    <circle cx="77" cy="66" r="6.5" fill="#1f6feb"/>
  </g>

  <text x="470" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="700" fill="#111827">跨海聊 CrossChat</text>
  <text x="472" y="278" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" fill="#4b5563">跨境电商 AI 客服回复草拟助手</text>
  <text x="472" y="326" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" fill="#6b7280">多语种翻译 · 知识库引用 · L0/L1/L2 成本分级 · 合规与 PII 护栏</text>

  <!-- chips -->
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#1d4ed8">
    <rect x="472" y="360" width="232" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="588" y="391" text-anchor="middle">只草拟，人工点发送</text>
    <rect x="716" y="360" width="196" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="814" y="391" text-anchor="middle">BYOK 自带 Key</text>
    <rect x="924" y="360" width="216" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1032" y="391" text-anchor="middle">数据只存本机</text>
    <rect x="1152" y="360" width="208" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1256" y="391" text-anchor="middle">匿名统计可关闭</text>
  </g>

  <text x="472" y="472" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#9ca3af">Chrome Manifest V3 · 适配主流跨境客服后台与 Gmail · 按站点授权，默认零读取</text>
</svg>
